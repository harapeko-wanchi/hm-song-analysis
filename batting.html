<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打線メーカー — Hey!Mommy! Song Analysis</title>
  <!-- OGP -->
  <meta property="og:title" content="打線メーカー — Hey!Mommy! Song Analysis">
  <meta property="og:description" content="Hey!Mommy! の楽曲で打線を組もう。1〜9番打順に曲を配置して守備位置・コメントを設定、SNSでシェア">
  <meta property="og:image" content="https://harapeko-wanchi.github.io/hm-song-analysis/img/og-batting.png?v=202610190011">
  <meta property="og:url" content="https://harapeko-wanchi.github.io/hm-song-analysis/batting.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/batting.css">
</head>
<body>

<nav class="nav"></nav>
<script src="scripts/nav.js"></script>

<div class="bt-page">
  <div class="bt-title">打線メーカー</div>
  <div class="bt-subtitle">Hey!Mommy! の楽曲で打線を組もう。選んだ曲を打順に配置、守備位置とコメントを設定してシェア</div>

  <div class="bt-layout">
    <!-- 曲プール -->
    <div class="bt-pool">
      <div class="bt-pool-header">曲一覧</div>
      <input type="text" id="btSearch" class="bt-pool-search" placeholder="曲名で検索...">
<div class="bt-pool-list" id="btPoolList"></div>
    </div>

    <!-- 打順 -->
    <div class="bt-lineup-wrap">
      <div class="bt-lineup" id="btLineup">
        <!-- 9スロットはJSで生成 -->
      </div>

      <!-- 投手陣 -->
      <div class="bt-pitcher-section">
<div class="bt-pitcher-slots" id="btPitcherSlots">
          <!-- 3スロットはJSで生成 -->
        </div>
      </div>

      <!-- アクションボタン -->
      <div class="bt-actions">
        <button id="btShareTwitter" class="bt-action-btn bt-action-twitter">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.733-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          Xでシェア
        </button>
        <button id="btCopyLink" class="bt-action-btn bt-action-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          リンクをコピー
        </button>
        <button id="btDownloadImg" class="bt-action-btn bt-action-img">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          画像で保存
        </button>
        <button id="btReset" class="bt-action-btn bt-action-reset">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
          リセット
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Song Picker Modal -->
<div class="bt-modal-overlay" id="btModal" hidden>
  <div class="bt-modal" role="dialog" aria-modal="true" aria-labelledby="btModalTitle">
    <div class="bt-modal-header">
      <span class="bt-modal-title" id="btModalTitle">曲を選択</span>
      <button class="bt-modal-close" id="btModalClose" aria-label="閉じる">✕</button>
    </div>
    <div class="bt-picker-chips" id="btPickerChips">
      <button class="bt-picker-chip active" data-axis="release" data-label="リリース">リリース ▼</button>
      <button class="bt-picker-chip" data-axis="cute"       data-label="キュート">キュート</button>
      <button class="bt-picker-chip" data-axis="cool"       data-label="クール">クール</button>
      <button class="bt-picker-chip" data-axis="emo"        data-label="エモ">エモ</button>
      <button class="bt-picker-chip" data-axis="childlike"  data-label="子供心">子供心</button>
      <button class="bt-picker-chip" data-axis="happy"      data-label="ハッピー">ハッピー</button>
      <button class="bt-picker-chip" data-axis="party"      data-label="お祭り">お祭り</button>
      <button class="bt-picker-chip" data-axis="band"       data-label="バンド">バンド</button>
      <button class="bt-picker-chip" data-axis="speed"      data-label="疾走感">疾走感</button>
      <button class="bt-picker-chip" data-axis="complexity" data-label="複雑度">複雑度</button>
      <button class="bt-picker-chip" data-axis="bpm"        data-label="BPM">BPM</button>
    </div>
    <div class="bt-modal-list" id="btModalList"></div>
  </div>
</div>

<div class="bt-toast" id="btToast"></div>

<script src="scripts/lz-string.min.js"></script>
<script src="scripts/batting.js"></script>
</body>
</html>
