<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年表 — Hey!Mommy! Song Analysis</title>
  <!-- OGP -->
  <meta property="og:title" content="年表 — Hey!Mommy! Song Analysis">
  <meta property="og:description" content="Hey!Mommy! の楽曲をリリース順にたどる年表と、BPM・9軸スコアの年ごとの推移">
  <meta property="og:image" content="https://harapeko-wanchi.github.io/hm-song-analysis/img/og-timeline.png">
  <meta property="og:url" content="https://harapeko-wanchi.github.io/hm-song-analysis/timeline.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/timeline.css">
</head>
<body>

<nav class="nav"></nav>
<script src="scripts/nav.js"></script>

<main class="tl">
  <header class="tl-head">
    <h1 class="tl-title">年表</h1>
    <p class="tl-sub">リリース順に楽曲をたどり、BPM と 9 軸スコアの年ごとの推移を見る</p>
  </header>

  <section class="tl-card" aria-labelledby="tlChartTitle">
    <div class="tl-metrics" id="tlMetrics" role="group" aria-label="表示する指標"></div>
    <h2 class="tl-chart-title" id="tlChartTitle"></h2>
    <p class="tl-chart-sub">点は各曲（クリックで詳細）、線は年ごとの平均</p>
    <div class="tl-chart" id="tlChart"></div>
    <details class="tl-table-wrap">
      <summary>年ごとの平均を表で見る</summary>
      <div class="tl-table-scroll"><table class="tl-table" id="tlTable"></table></div>
    </details>
  </section>

  <section class="tl-years" id="tlYears" aria-label="年ごとの楽曲"></section>
</main>

<div class="tl-tooltip" id="tlTooltip" role="tooltip" hidden></div>

<script src="scripts/common.js"></script>
<script src="scripts/timeline.js"></script>
</body>
</html>
