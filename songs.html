<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲一覧 — Hey!Mommy! Song Analysis</title>
  <!-- OGP -->
  <meta property="og:title" content="楽曲一覧 — Hey!Mommy! Song Analysis">
  <meta property="og:description" content="Hey!Mommy! 楽曲分析 — 9軸スコアと3つのポジションマップで特徴を可視化">
  <meta property="og:image" content="https://harapeko-wanchi.github.io/hm-song-analysis/img/og-songs.png?v=202610190011">
  <meta property="og:url" content="https://harapeko-wanchi.github.io/hm-song-analysis/songs.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/songs.css">
</head>
<body>

<nav class="nav"></nav>
<script src="scripts/nav.js"></script>

<section class="list-toolbar" aria-label="絞り込みと並び替え">
  <div class="lt-row">
    <input type="search" id="ltSearch" class="lt-search" placeholder="曲名・タグ・歌詞フック・解説で検索" aria-label="キーワード検索">
    <div class="lt-sort">
      <select id="ltSort" class="lt-select" aria-label="並び替え"></select>
      <button type="button" id="ltOrder" class="lt-order" aria-label="並び順を切り替え"></button>
    </div>
  </div>
  <div class="lt-row lt-chips-row">
    <span class="lt-label">作曲</span>
    <div class="lt-chips" id="ltComposers"></div>
  </div>
  <div class="lt-row lt-chips-row">
    <span class="lt-label">リリース</span>
    <div class="lt-chips" id="ltYears"></div>
  </div>
  <div class="lt-row lt-status">
    <span id="ltCount" class="lt-count" aria-live="polite"></span>
    <button type="button" id="ltReset" class="lt-reset" hidden>条件をクリア</button>
  </div>
</section>

<main class="cards-grid" id="cards"></main>
<p class="lt-empty" id="ltEmpty" hidden>条件に合う曲がありません</p>

<script src="scripts/common.js"></script>
<script src="scripts/songs.js"></script>
</body>
</html>
