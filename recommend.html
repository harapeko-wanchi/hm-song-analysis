<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲レコメンド — Hey!Mommy! Song Analysis</title>
  <!-- OGP -->
  <meta property="og:title" content="楽曲レコメンド — Hey!Mommy! Song Analysis">
  <meta property="og:description" content="Hey!Mommy! の楽曲を選んで、似ている曲を発見しよう">
  <meta property="og:image" content="https://harapeko-wanchi.github.io/hm-song-analysis/img/og-recommend.png">
  <meta property="og:url" content="https://harapeko-wanchi.github.io/hm-song-analysis/recommend.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/recommend.css">
</head>
<body>

<nav class="nav"></nav>
<script src="scripts/nav.js"></script>

<div class="rec-page">
  <div class="rec-title">楽曲レコメンド</div>
  <div class="rec-subtitle">「この曲が好きなら」— 9軸スコアの類似度で近い楽曲を発見</div>

  <div class="rec-picker">
    <label class="rec-picker-label" for="songSelect">楽曲を選択</label>
    <select id="songSelect" class="rec-select">
      <option value="">-- 曲を選んでください --</option>
    </select>
    <button id="randomBtn" class="rec-random-btn" title="ランダムに選ぶ">🎲</button>
  </div>

  <div class="rec-result" id="recResult" style="display:none">
    <!-- Source song card -->
    <div class="rec-source" id="recSource"></div>

    <div class="rec-arrow">▼ 似ている曲 TOP 5</div>

    <!-- Similar songs list -->
    <div class="rec-list" id="recList"></div>
  </div>

  <div class="rec-empty" id="recEmpty">
    <div class="rec-empty-icon">🎵</div>
    <p>上のセレクトボックスから曲を選ぶと、<br>9軸スコアが近い楽曲 TOP 5 を表示します</p>
  </div>
</div>

<script src="scripts/common.js"></script>
<script src="scripts/recommend.js"></script>
</body>
</html>
