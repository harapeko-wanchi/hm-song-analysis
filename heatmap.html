<div class="heatmap-page">
  <div class="heatmap-title">スコアヒートマップ</div>
  <div class="heatmap-subtitle">全楽曲 × 9軸を色で一覧 — 列ヘッダをクリックでソート</div>

  <div class="sort-bar" id="sortBar">
    <button class="sort-btn active" data-sort="release">リリース順</button>
    <button class="sort-btn" data-sort="title">曲名順</button>
    <button class="sort-btn" data-sort="bpm">BPM順</button>
    <button class="sort-btn" data-sort="composer">作曲家別</button>
  </div>

  <div class="heatmap-scroll">
    <table class="hm-table" id="hmTable">
      <thead id="hmHead"></thead>
      <tbody id="hmBody"></tbody>
    </table>
  </div>

  <div class="color-mode-bar" id="colorModeBar">
    <button class="color-mode-btn active" data-mode="unified">共通カラー</button>
    <button class="color-mode-btn" data-mode="composer">作曲家別カラー</button>
  </div>

  <div id="legendArea">
    <div class="color-legend" id="unifiedLegend">
      <span>0</span>
      <div class="color-legend-bar"></div>
      <span>10</span>
    </div>
    <div class="composer-legend" id="composerLegend" style="display:none"></div>
  </div>
</div>

<div class="hm-tooltip" id="hmTooltip">
  <div class="tt-song"></div>
  <div class="tt-axis"></div>
</div>

<script src="scripts/heatmap.js"></script>
